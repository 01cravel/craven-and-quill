<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>UK launch test | Craven &amp; Quill</title><link rel="stylesheet" href="styles.css?v=14"><style>main{max-width:1100px;margin:40px auto;padding:24px}h1{font:3rem Georgia,serif}label{display:block;margin:16px 0 6px}input,button{font:inherit;padding:12px;border:1px solid #ced7ce;border-radius:12px}button{cursor:pointer;background:#17332c;color:#fff}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:24px 0}.stats article{background:#fff;padding:24px;border-radius:20px}.stats strong{display:block;font:2.5rem Georgia,serif}table{border-collapse:collapse;width:100%;background:white}th,td{padding:12px;text-align:left;border-bottom:1px solid #dde4dc}.table-wrap{overflow:auto}#error{color:#a33e2c}.note{color:#52675e;font-size:.9rem}#report[hidden]{display:none}</style></head><body><main><a href="/">Craven &amp; Quill</a><h1>UK launch test</h1><p>Private results. The access token stays in this page’s memory and is never added to the address.</p><form id="report-form"><label for="access-token">Signup export access token</label><input id="access-token" type="password" autocomplete="off" required><div class="controls"><div><label for="since">From</label><input id="since" type="date" required></div><div><label for="spend">Meta spend in GBP</label><input id="spend" type="number" min="0" step="0.01" value="0"></div><button>Load results</button><button id="export" type="button">Download launch list</button></div></form><p id="error" role="alert"></p><section id="report" hidden><div class="stats" id="stats"></div><p id="decision"></p><p id="note" class="note"></p><h2>Signups by ad</h2><div class="table-wrap"><table><thead><tr><th>Source</th><th>Campaign</th><th>Ad</th><th>Country</th><th>Signups</th><th>S
