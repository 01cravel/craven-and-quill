<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Stop offer emails | Craven &amp; Quill</title><link rel="stylesheet" href="/orders.css"></head><body><header><a href="/">Craven &amp; Quill</a><span>Email preferences</span></header><main class="wrap"><h1>Stop offer emails</h1><p>You will still receive messages needed for any book you order.</p><p id="message" role="status"></p><button id="stop">Stop offer emails</button></main><script>
const token=new URLSearchParams(location.search).get('token');const button=document.querySelector('#stop'),message=document.querySelector('#message');if(!/^[a-f0-9-]{36}$/.test(token||'')){button.disabled=true;message.textContent='This link is invalid.';}button.onclick=async()=>{button.disabled=true;try{const r=await fetch('/api/orders/offer-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw Error();message.textContent='Offer emails stopped.';}catch{button.disabled=false;message.textContent='Could not update this preference. Please try again.';}};
</script></body></html>
