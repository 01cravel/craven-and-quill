<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Your book | Craven &amp; Quill</title>
<link rel="icon" href="/assets/favicon.png">
<style>
/* The customer's private flip-through book: the exact print file as pictures, one Approve button. (19 Nov 2026) */
:root{
  --green:#123a30; --green-deep:#0b241e; --paper:#fdf8ee; --end:#f3eddf; --ink:#f4efe2; --muted:#b7c2bb; --gold:#c9a45c; --gold-ink:#1d1a12;
  --page-h:min(calc(100vh - 290px), calc(100svh - 290px), calc((100vw - 140px) / 1.414)); --page-w:calc(var(--page-h) * .7071);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 35%, var(--green) 0%, var(--green-deep) 78%) fixed;color:var(--ink);
  font:16px/1.5 Georgia,"Iowan Old Style","Times New Roman",serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 6px;text-align:center}
header img{width:74px;height:auto}
h1{font-weight:400;font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.2;margin:6px 0 0;max-width:30ch}
.lede{color:var(--muted);margin:0;font-size:.98rem}
main{display:flex;flex-direction:column;align-items:center;padding:14px 0 120px}
.stage{display:flex;align-items:center;gap:22px;perspective:2600px}
.book{position:relative;width:calc(var(--page-w) * 2);height:var(--page-h);transition:transform .5s ease}
.book.front{transform:translateX(calc(var(--page-w) * -.5))}
.book.back{transform:translateX(calc(var(--page-w) * .5))}
.side{position:absolute;top:0;width:var(--page-w);height:100%;overflow:hidden;background:var(--paper)}
.side.l{left:0;border-radius:3px 0 0 3px}.side.r{left:var(--page-w);border-radius:0 3px 3px 0}
.side img,.face img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.side img.in,.face img.in{opacity:1}
.side.none{background:transparent}.side.end{background:var(--end)}
.side:not(.none){box-shadow:0 30px 50px -22px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.25)}
.side.l:not(.none):not(.cover)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,.05) 4%,transparent 12%)}
.side.r:not(.none):not(.cover)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.24),rgba(0,0,0,.06) 4%,transparent 12%)}
.side.cover{border-radius:4px}
.leaf{position:absolute;top:0;left:var(--page-w);width:var(--page-w);height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:5;transition:transform .7s cubic-bezier(.45,.05,.3,1)}
.leaf.rev{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden}
.face img{display:block;width:100%;height:100%;object-fit:cover}.face.end{background:var(--end)}
.face.rear{transform:rotateY(180deg)}
.nav{appearance:none;border:1px solid rgba(244,239,226,.28);background:rgba(0,0,0,.2);color:var(--ink);width:52px;height:52px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer;flex:none}
.nav:hover{border-color:var(--gold)}.nav:disabled{opacity:.25;cursor:default}
.nav:focus-visible,.approve:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.where{color:var(--muted);font-size:.92rem;margin-top:16px;min-height:1.4em;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(8,26,21,.92);backdrop-filter:blur(6px);border-top:1px solid rgba(201,164,92,.25)}
.bar p{margin:0;color:var(--muted);font-size:.92rem;max-width:34ch}
.approve{appearance:none;border:0;border-radius:999px;background:var(--gold);color:var(--gold-ink);font:700 1.05rem/1 Arial,Helvetica,sans-serif;padding:16px 42px;cursor:pointer;letter-spacing:.01em}
.approve:hover{filter:brightness(1.06)}.approve:disabled{opacity:.5;cursor:default}
.done{color:var(--ink);font-size:1rem;text-align:center}
.done b{color:var(--gold);font-weight:400}
dialog{border:0;border-radius:10px;padding:26px 24px;max-width:420px;width:calc(100% - 32px);background:var(--paper);color:#1f2a25;font:16px/1.55 Georgia,serif}
dialog::backdrop{background:rgba(5,15,12,.6)}
dialog h2{font-weight:400;font-size:1.4rem;margin:0 0 8px}
dialog p{margin:0 0 20px;color:#47524c}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ghost{appearance:none;border:1px solid #c9c2b1;background:transparent;border-radius:999px;padding:14px 22px;font:600 .98rem Arial,Helvetica,sans-serif;color:#1f2a25;cursor:pointer}
dialog .approve{padding:14px 26px;font-size:.98rem}
.msg{max-width:36ch;text-align:center;color:var(--muted);padding:40px 16px}
.err{color:#f1b9a7}
/* Phones: one page at a time, swipe or tap to turn. */
@media (max-width:760px){
  :root{--page-h:min(calc(100vh - 270px), calc(100svh - 270px), calc((100vw - 32px) * 1.414));--page-w:calc(var(--page-h) * .7071)}
  .stage{gap:0}.nav{display:none}
  .book,.book.front,.book.back{width:var(--page-w);transform:none}
  .side.l{display:none}.side.r{left:0;border-radius:3px}
  .side.r::after{display:none}
  .book.flash .side.r img{animation:in .28s ease}
  @keyframes in{from{opacity:.25;transform:translateX(var(--from,24px))}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition:none}.book.flash .side.r img{animation:none}}
</style>
</head>
<body>
<header>
  <img src="/assets/logo-on-dark.png" alt="Craven &amp; Quill" width="74" height="51">
  <h1 id="title">Your book</h1>
  <p class="lede" id="lede">Loading your book…</p>
</header>
<main>
  <div class="stage" id="stage" hidden>
    <button class="nav" id="prev" type="button" aria-label="Previous pages">‹</button>
    <div class="book" id="book" aria-live="polite">
      <div class="side l" id="left"></div>
      <div class="side r" id="right"></div>
    </div>
    <button class="nav" id="next" type="button" aria-label="Next pages">›</button>
  </div>
  <div class="where" id="where"></div>
  <div class="msg" id="msg" hidden></div>
</main>
<div class="bar" id="bar" hidden>
  <p id="barText">Happy with every page?</p>
  <button class="approve" id="approve" type="button">Approve</button>
</div>
<dialog id="confirm">
  <h2 id="confirmTitle">Approve this book?</h2>
  <p>We’ll send it to print exactly as you see it here. Want something changed first? Just reply to our email instead.</p>
  <div class="row"><button class="ghost" id="cancel" type="button">Keep looking</button><button class="approve" id="yes" type="button">Approve</button></div>
</dialog>
<script>
(()=>{
const $=id=>document.getElementById(id),END='end';
const id=new URLSearchParams(location.search).get('id')||'',key=(location.hash.match(/key=([^&]+)/)||[])[1]||'';
const auth={Authorization:'Bearer '+key};
let order=null,pics=[],spreads=[],at=0,busy=false;
const phone=()=>matchMedia('(max-width:760px)').matches;
function fail(text){$('stage').hidden=true;$('bar').hidden=true;$('where').textContent='';$('lede').textContent='';const m=$('msg');m.hidden=false;m.innerHTML=text;}
async function api(path,body){const r=await fetch('/api/orders/'+encodeURIComponent(id)+path,body?{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify(body)}:{headers:auth});let d={};try{d=await r.json();}catch{}if(!r.ok)throw Error(d.error||'Something went wrong.');return d;}
function poss(n){return n?n+(/s$/i.test(n)?'’':'’s'):'Your';}
// Page pictures load with the private key, then show from memory.
const ready=[];function pic(i){if(!pics[i])pics[i]=fetch('/api/orders/'+encodeURIComponent(id)+'/file?file='+encodeURIComponent(order.bookPages[i]),{headers:auth}).then(r=>{if(!r.ok)throw Error();return r.blob();}).then(b=>ready[i]=URL.createObjectURL(b));return pics[i];}
function img(el,i){el.replaceChildren();const im=new Image();im.alt='Page '+(i+1);im.decoding='async';if(ready[i]){im.src=ready[i];im.className='in';el.append(im);return;}im.onload=()=>im.classList.add('in');pic(i).then(u=>{im.src=u;}).catch(()=>{});el.append(im);}
// Load every page quietly in the background, three at a time, so turning is instant.
async function preload(){const n=order.bookPages.length;let next=0;const worker=async()=>{while(next<n){const i=next++;await pic(i).catch(()=>{});}};await Promise.all([worker(),worker(),worker()]);}
function fill(el,src,cover){el.className=el.className.split(' ').slice(0,2).join(' ');el.replaceChildren();if(src===null){el.classList.add('none');return;}if(src===END){el.classList.add('end');return;}if(cover)el.classList.add('cover');img(el,src);}
function face(el,src){el.replaceChildren();el.classList.toggle('end',src===END);if(src!==null&&src!==END)img(el,src);}
function build(){const n=order.bookPages.length;spreads=[];
  if(phone()){for(let i=0;i<n;i++)spreads.push({right:i,label:i===0?'Front cover':i===n-1?'Back cover':'Page '+(i+1)+' of '+n});return;}
  spreads.push({left:null,right:0,state:'front',cover:true,label:'Front cover'});spreads.push({left:END,right:1,label:'Opening page'});
  for(let i=2;i<n-2;i+=2)spreads.push({left:i,right:i+1,label:'Pages '+(i+1)+' and '+(i+2)});
  spreads.push({left:n-2,right:END,label:'The End'});spreads.push({left:n-1,right:null,state:'back',cover:true,label:'Back cover'});}
function show(dir=0){const s=spreads[at];if(!phone())fill($('left'),s.left??null,s.cover);fill($('right'),s.right,s.cover&&!phone());
  $('book').className='book'+(s.state&&!phone()?' '+s.state:'');if(phone()&&dir){$('book').style.setProperty('--from',(dir>0?24:-24)+'px');void $('book').offsetWidth;$('book').classList.add('flash');}
  $('where').textContent=s.label;$('prev').disabled=at===0;$('next').disabled=at===spreads.length-1;
  for(const k of [s.left,s.right,(spreads[at+1]||{}).left,(spreads[at+1]||{}).right])if(Number.isInteger(k))pic(k).catch(()=>{});}
function turn(dir){if(busy)return;const to=at+dir;if(to<0||to>=spreads.length)return;const from=spreads[at],next=spreads[to];
  if(phone()||matchMedia('(prefers-reduced-motion: reduce)').matches||from.cover||next.cover){at=to;show(dir);return;}
  busy=true;const leaf=document.createElement('div');leaf.className='leaf'+(dir<0?' rev':'');const f=document.createElement('div');f.className='face';const r=document.createElement('div');r.className='face rear';leaf.append(f,r);
  if(dir>0){face(f,from.right);face(r,next.left);fill($('right'),next.right);}else{face(f,from.left);face(r,next.right);fill($('left'),next.left);}
  $('book').append(leaf);requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.style.transform='rotateY('+(dir>0?-180:180)+'deg)';}));
  let ended=false;const end=()=>{if(ended)return;ended=true;leaf.remove();at=to;show();busy=false;};leaf.addEventListener('transitionend',end,{once:true});setTimeout(end,1100);}
$('next').onclick=()=>turn(1);$('prev').onclick=()=>turn(-1);
$('book').addEventListener('click',e=>{const r=$('book').getBoundingClientRect();turn(e.clientX<r.left+r.width/2?-1:1);});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);});
let sx=null,sy=null;$('book').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('book').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){e.preventDefault();turn(dx<0?1:-1);}},{passive:false});
let wasPhone=phone();addEventListener('resize',()=>{if(phone()===wasPhone||!order)return;const page=spreads[at].right??spreads[at].left;wasPhone=phone();build();at=Math.max(0,spreads.findIndex(s=>s.right===page||s.left===page));show();});
function approved(){$('bar').hidden=false;$('bar').replaceChildren();const p=document.createElement('p');p.className='done';p.innerHTML='<b>Approved.</b> Thank you, we’re getting '+(order.names?order.names.replace(/[<&>]/g,'')+'’s':'your')+' book ready to print.';$('bar').append(p);}
function controls(){if(order.customerApproved||['awaiting_approval','approved','submitting','submitted','supplier_unknown'].includes(order.status))return approved();
  if(order.status!=='proof_ready'){$('bar').hidden=false;$('approve').hidden=true;$('barText').textContent='We’re making a few final changes. We’ll email you when it’s ready.';return;}
  $('bar').hidden=false;}
$('approve').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>$('confirm').close();
$('yes').onclick=async()=>{$('yes').disabled=true;try{order=await api('/approve-proof',{revision:order.revision,proofHash:order.proof.hash,confirm:true});$('confirm').close();approved();}catch(e){$('confirm').close();$('barText').textContent=e.message.includes('changed')?'This book was just updated. Reloading…':e.message;if(e.message.includes('changed'))setTimeout(()=>location.reload(),1500);}finally{$('yes').disabled=false;}};
(async()=>{if(!id||key.length<32)return fail('This link isn’t complete. Please open the link from our email again.');
  try{order=await api('');}catch(e){return fail('We couldn’t open this book. Please open the link from our email again, or reply to that email and we’ll help.');}
  const title=order.story?.title||'Your book';document.title=title+' | Craven & Quill';$('title').textContent=title;$('confirmTitle').textContent='Approve '+poss(order.names)+' book?';
  if(!order.bookPages?.length)return fail('We’re putting the finishing touches to this book. We’ll email you as soon as it’s ready to see.');
  $('lede').textContent=phone()?'Swipe or tap to turn the pages.':'Click a page or use the arrows to turn.';
  build();$('stage').hidden=false;show();controls();preload();})();
})();
</script>
</body>
</html>
