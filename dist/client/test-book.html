<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f1">
  <meta name="description" content="A finished personalised Craven & Quill test book.">
  <title>Finished test book | Craven & Quill</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="preload" href="assets/story-serif.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="test-book.css?v=11">
</head>
<body>
  <a class="skip" href="#book">Skip to the book</a>
  <header class="reader-header">
    <a class="brand" href="index.html" aria-label="Craven and Quill home"><img src="assets/logo-mark-on-white.png" width="420" height="401" alt=""></a>
    <div class="page-status"><span id="page-label">The book</span><div class="page-progress"><i id="page-progress"></i></div></div>
    <a class="exit" href="index.html">Close</a>
  </header>

  <main id="book" class="reader">
    <section class="order-banner" id="order-banner" hidden>
      <strong id="order-heading">We’re making their book.</strong>
      <p id="order-text"></p>
    </section>

    <nav class="book-switcher" aria-label="Choose an example book">
      <a href="test-book.html?book=noah&amp;sample=1" data-book="noah">Ages 3–5</a>
      <a href="test-book.html?book=amara&amp;sample=1" data-book="amara">Ages 6–8</a>
      <a href="test-book.html?book=oliver&amp;sample=1" data-book="oliver">Ages 9–12</a>
      <a href="test-book.html?book=luke&amp;sample=1" data-book="luke">Adults</a>
    </nav>

    <section class="page-stage cover-stage" id="page-stage" aria-live="polite">
      <div class="art-frame" id="art-frame">
        <img id="page-art" src="" width="1122" height="1402" alt="">
        <div class="cover-copy" id="cover-copy"><p>A personalised story for <span id="cover-name"></span></p><h1 id="cover-title"></h1><span id="cover-meta"></span></div>
      </div>
      <article class="page-copy" id="page-copy">
        <p class="chapter" id="chapter"></p>
        <h1 id="page-title"></h1>
        <p id="page-text"></p>
        <span class="page-number" id="page-number"></span>
      </article>
    </section>

    <nav class="page-nav" aria-label="Turn the page">
      <button class="book-arrow" type="button" id="previous" aria-label="Previous page"></button>
      <span class="page-count" id="page-count">Cover</span>
      <button class="book-arrow book-arrow-next" type="button" id="next" aria-label="Next page"><span>Open the book</span></button>
    </nav>

    <div class="dots" id="dots" hidden></div>
    <p class="test-note" id="test-note" hidden></p>
    <span id="turn-sheet" hidden></span>
  </main>
  <script src="test-book.js?v=12" defer></script>
</body>
</html>
